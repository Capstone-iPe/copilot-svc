[project]
name = "ipe-copilot"
version = "0.1.0"
description = "Merchant onboarding copilot. MCP client, remote corpus search, hosted chat."
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "psycopg[binary]>=3.2",
    "httpx",
    "langfuse==3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pyright]
pythonVersion = "3.12"
extraPaths = ["src"]
typeCheckingMode = "basic"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
