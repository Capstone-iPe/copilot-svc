# Capstone-iPe/copilot-svc FastAPI → live ONB MCP.
# Secrets stay sync: false. Google refresh stays on the FE.

services:
  - type: keyvalue
    name: copilot-cache
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
  - type: web
    name: copilot-svc
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=src python -m copilot
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ALLOWED_AUDIENCES
        sync: false
      - key: CHAT_BASE_URL
        value: https://103.42.50.41:1032/v1
      - key: CHAT_CA_CERT
        value: /etc/secrets/vm06-ca.crt
      - key: CHAT_MODEL
        value: Qwen/Qwen3-8B
      - key: CORPUS_SEARCH_URL
        value: https://onb-corpus.onrender.com
      - key: ONB_MCP_URL
        value: https://onb-k8ud.onrender.com/mcp
      - key: CHAT_API_KEY
        sync: false
      - key: CORPUS_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: copilot-cache
          type: keyvalue
          property: connectionString
